name: Build APK (French)

# Builds the French My LOOI APK and publishes it as a GitHub Release, so it can
# be downloaded directly from a phone (Releases page → my-looi-fr.apk).
#
# Signing: the permanent key is stored encrypted in signing/ and unlocked with
# the repository secret LOOI_KEYSTORE_PASSWORD. Every APK is signed with the
# same key, so new versions install over the previous one and keep LOOI's
# memory and settings. The build stops if the secret is missing.
# Offline voice-command models bundled: French + small English (see VOSK_LANGUAGES).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: write

concurrency:
  group: build-apk-fr
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MY_LOOI_RELEASE_KEY_ALIAS: my-looi
      MY_LOOI_RELEASE_STORE_PASSWORD: ${{ secrets.LOOI_KEYSTORE_PASSWORD }}
      MY_LOOI_RELEASE_KEY_PASSWORD: ${{ secrets.LOOI_KEYSTORE_PASSWORD }}
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android SDK 36 (preinstalled SDK on the runner)
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          sm="$sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sm" --licenses > /dev/null || true
          "$sm" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile

      - name: Check code (TypeScript + French tests)
        run: |
          corepack pnpm exec tsc --noEmit
          node scripts/french-language.test.mjs
          node scripts/gemini-live-adapter.test.mjs
          node scripts/mistral-cascade.test.mjs
          corepack pnpm run motion:safety-test
          corepack pnpm run motion:cliff-test

      - name: Unlock the permanent signing key
        run: |
          if [ -z "$MY_LOOI_RELEASE_STORE_PASSWORD" ]; then
            echo "::error::Secret LOOI_KEYSTORE_PASSWORD manquant. Ajoute-le dans Settings > Secrets and variables > Actions, puis relance."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          ks="$RUNNER_TEMP/signing/my-looi-release.keystore"
          printf '%s' "$MY_LOOI_RELEASE_STORE_PASSWORD" > "$RUNNER_TEMP/signing/pw"
          if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 \
               -in signing/my-looi-release.keystore.enc -out "$ks" -pass "file:$RUNNER_TEMP/signing/pw"; then
            echo "::error::Mot de passe LOOI_KEYSTORE_PASSWORD incorrect (vérifie qu'il n'y a pas d'espace en trop)."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/signing/pw"
          keytool -list -keystore "$ks" -storepass "$MY_LOOI_RELEASE_STORE_PASSWORD" | grep -i fingerprint
          echo "MY_LOOI_RELEASE_KEYSTORE=$ks" >> "$GITHUB_ENV"

      - name: Download offline voice-command models (incl. French)
        run: bash scripts/download-vosk-command-models.sh

      - name: Generate Android project
        run: |
          corepack pnpm exec expo prebuild --platform android --clean
          node scripts/apply-android-release-signing.mjs android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name the APK
        id: apk
        run: |
          version="$(node -p 'require("./package.json").version')"
          mkdir -p output
          cp android/app/build/outputs/apk/release/app-release.apk output/my-looi-fr.apk
          ( cd output && sha256sum my-looi-fr.apk > my-looi-fr.apk.sha256 )
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: my-looi-fr-apk
          path: output/my-looi-fr.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fr-build-${{ github.run_number }}
          name: My LOOI FR ${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          body: |
            Version française de My LOOI. Sur ton téléphone Android, télécharge **my-looi-fr.apk** ci-dessous puis ouvre-le pour l'installer.
          files: |
            output/my-looi-fr.apk
            output/my-looi-fr.apk.sha256
          make_latest: true
